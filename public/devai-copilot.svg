<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DevAI Copilot</title>
  <desc id="desc">Developer AI copilot project preview</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="100" r="180" fill="#67e8f9" opacity=".12"/>
  <circle cx="140" cy="620" r="220" fill="#a7f3d0" opacity=".08"/>
  <rect x="90" y="105" width="1020" height="490" rx="28" fill="url(#panel)" stroke="#ccfbf1" stroke-opacity=".25"/>
  <circle cx="130" cy="145" r="8" fill="#99f6e4"/>
  <circle cx="158" cy="145" r="8" fill="#a5f3fc"/>
  <circle cx="186" cy="145" r="8" fill="#bfdbfe"/>
  <text x="130" y="235" fill="#ccfbf1" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">DevAI Copilot</text>
  <text x="130" y="282" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="20">AI-assisted development workflow</text>
  <rect x="130" y="330" width="610" height="190" rx="18" fill="#020617" opacity=".48"/>
  <text x="160" y="375" fill="#94a3b8" font-family="monospace" font-size="18">// Ask your copilot</text>
  <text x="160" y="418" fill="#e2e8f0" font-family="monospace" font-size="20">Explain this function and</text>
  <text x="160" y="452" fill="#e2e8f0" font-family="monospace" font-size="20">suggest an optimized version.</text>
  <text x="160" y="500" fill="#67e8f9" font-family="monospace" font-size="18">AI › ready to help</text>
  <rect x="785" y="330" width="270" height="190" rx="18" fill="#ecfeff" opacity=".94"/>
  <path d="M920 370l15 30 33 5-24 23 6 33-30-16-30 16 6-33-24-23 33-5z" fill="#0f766e"/>
  <text x="920" y="470" text-anchor="middle" fill="#134e4a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Build faster</text>
  <text x="920" y="497" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15">with AI assistance</text>
</svg>
